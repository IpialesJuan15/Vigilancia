name: Calidad F0
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.11.11
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff check app alembic && uv run ruff format --check app alembic
        working-directory: backend
      - run: uv run mypy app --exclude app/tests
        working-directory: backend
      - run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=70
        working-directory: backend
  web-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run format:check && npm run typecheck && npm run build
        working-directory: frontend
      - run: docker compose up --build -d --wait
      - run: docker compose exec -T api sh /app/entrypoint.sh alembic check
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - if: failure()
        run: docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down
