# Managed-cloud TLS trust. Keep proxy defaults supplied by Docker.
services:
  grobid:
    environment:
      JAVA_TOOL_OPTIONS: -XX:-UseContainerSupport -Xmx2g
  minio:
    build:
      context: ./infrastructure/minio
      secrets: [ca_bundle]
  api:
    build:
      context: ./backend
      secrets: [ca_bundle]
    volumes:
      - ${SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}:/run/cloud-ca.pem:ro
    environment:
      SSL_CERT_FILE: /run/cloud-ca.pem
  migrate:
    build:
      context: ./backend
      secrets: [ca_bundle]
  worker:
    build:
      context: ./backend
      secrets: [ca_bundle]
    volumes:
      - ${SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}:/run/cloud-ca.pem:ro
    environment:
      SSL_CERT_FILE: /run/cloud-ca.pem
  beat:
    build:
      context: ./backend
      secrets: [ca_bundle]
    volumes:
      - ${SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}:/run/cloud-ca.pem:ro
    environment:
      SSL_CERT_FILE: /run/cloud-ca.pem
  frontend:
    build:
      context: ./frontend
      secrets: [ca_bundle]
secrets:
  ca_bundle:
    file: ${SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}
