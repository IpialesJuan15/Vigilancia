[project]
name = "livesrl-api"
version = "0.1.0"
description = "LiveSRL: revisiones sistemáticas vivas"
requires-python = ">=3.12,<3.13"
dependencies = [
 "fastapi==0.162.0", "uvicorn==0.49.0", "sqlalchemy==2.1.8",
 "alembic==1.20.1", "psycopg[binary]==3.3.8", "pydantic-settings==2.16.2",
 "email-validator==2.3.0", "argon2-cffi==25.1.0", "pyjwt==2.15.1",
 "httpx==0.28.1", "celery[redis]==5.7.0", "redis==8.1.0"
]
[dependency-groups]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "ruff==0.17.4", "mypy==2.4.1"]
[tool.pytest.ini_options]
testpaths = ["app/tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "app/cli.py"]
