name: livesrl
x-api: &api
  build: ./backend
  image: livesrl-api:local
  restart: unless-stopped
  environment: &api-env
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://livesrl:livesrl@db:5432/livesrl}
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:-}
    APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    SMTP_HOST: ${SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
    SMTP_FROM: ${SMTP_FROM:-LiveSRL <noreply@livesrl.test>}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},db,redis,minio,grobid,api
    no_proxy: ${NO_PROXY:-localhost,127.0.0.1},db,redis,minio,grobid,api
    S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-livesrl-local}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-livesrl-local-only}
    S3_BUCKET: ${S3_BUCKET:-livesrl}
    OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
    PROJECT_CONTACT: ${PROJECT_CONTACT:-https://github.com/IpialesJuan15/Vigilancia}
    ORCID_CLIENT_ID: ${ORCID_CLIENT_ID:-}
    ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET:-}
    ORCID_REDIRECT_URI: ${ORCID_REDIRECT_URI:-http://localhost:3000/api/auth/orcid/callback}
  volumes:
    - auth-state:/state
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: livesrl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livesrl}
      POSTGRES_DB: livesrl
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livesrl -d livesrl"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    <<: *api
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *api
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
  worker:
    <<: *api
    command: ["celery", "-A", "app.tasks:celery", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      api: {condition: service_healthy}
      mailpit: {condition: service_started}
      minio: {condition: service_started}
  beat:
    <<: *api
    command: ["celery", "-A", "app.tasks:celery", "beat", "--loglevel=INFO", "--schedule=/state/celerybeat-schedule"]
    depends_on:
      api: {condition: service_healthy}
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["127.0.0.1:${APP_PORT:-3000}:3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
  minio:
    build: ./infrastructure/minio
    image: livesrl-minio:local
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-livesrl-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-livesrl-local-only}
    volumes: ["objects:/data"]
  grobid:
    image: lfoppiano/grobid:0.8.2
    restart: unless-stopped
volumes:
  postgres:
  redis:
  objects:
  auth-state:
